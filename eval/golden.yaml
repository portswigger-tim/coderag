# Golden questions for `coderag eval`.
#
# Each entry carries two things: what a correct answer must contain, and the
# grep an agent would plausibly reach for first. The harness measures both
# the tokens coderag spends and the tokens the naive grep-then-read path
# would spend, so cheapness and correctness are scored together. A tool can
# always be made cheaper by returning less; `expect_*` and `must_contain`
# are what stop that from looking like an improvement.

# How the naive baseline is modelled. An agent greps, scans the hit list,
# then opens the most promising files. read_files is how many it opens.
baseline:
  read_files: 4

questions:
  - id: q1
    repo: bookstore-python
    baseline_root: python
    question: "How is the bulk discount calculated?"
    baseline_grep: "discount"
    expect_symbols:
      - services.pricing.PricingService.apply_bulk_discount
    min_recall: 1.0

  - id: q2
    repo: bookstore-python
    baseline_root: python
    question: "Where are orders persisted?"
    baseline_grep: "order"
    expect_symbols:
      - repositories.order_repo.OrderRepository.save
    min_recall: 1.0

  - id: q3
    repo: bookstore-python
    baseline_root: python
    question: "How does a customer get an order confirmation email?"
    baseline_grep: "email"
    expect_symbols:
      - notifications.emailer.send_confirmation
    min_recall: 1.0

  - id: q4
    repo: bookstore-python
    baseline_root: python
    question: "What happens when a customer places an order?"
    baseline_grep: "place_order"
    expect_symbols:
      - api.routes.create_order
      - services.order_service.OrderService.place_order
      - services.pricing.PricingService.apply_bulk_discount
      - notifications.emailer.send_confirmation
    min_recall: 0.75

  # The grep trap: two unrelated validate() functions in the same codebase --
  # one checks a domain object, the other checks an HTTP payload. A name-only
  # search returns both and cannot tell them apart. The graph can.
  - id: q5
    repo: bookstore-python
    baseline_root: python
    question: "How are carts validated before pricing in the Python service?"
    baseline_grep: "validate"
    expect_symbols:
      - services.pricing.validate
    forbid_symbols:
      - api.forms.validate
    min_recall: 1.0

  # Co-change only. No import and no call connects pricing.py to rates.yaml.
  - id: q6
    tool: what_breaks
    target: services.pricing.PricingService.apply_bulk_discount
    repo: bookstore-python
    baseline_root: python
    question: "If I change the bulk discount thresholds, what else needs updating?"
    baseline_grep: "bulk_thresholds"
    must_contain:
      - "config/rates.yaml"
    max_tokens: 400

  # TESTED_BY only.
  - id: q7
    tool: what_tests
    target: services.pricing.PricingService.apply_bulk_discount
    repo: bookstore-python
    baseline_root: python
    question: "What tests cover the bulk discount?"
    baseline_grep: "apply_bulk_discount"
    must_contain:
      - "tests/test_pricing.py"
    max_tokens: 300

  # Context sufficiency: everything required to make a specific change.
  - id: q8
    tool: symbol_context
    target: services.pricing.PricingService.apply_bulk_discount
    repo: bookstore-python
    baseline_root: python
    baseline_grep: "Tier"
    question: "I need to add a PLATINUM tier. What must the pack tell me?"
    must_contain:
      - "Tier"                      # the enum to extend
      - "config/rates.yaml"  # the rates needing a new entry
      - "tests/test_pricing.py"  # the test asserting tier behaviour
      - "order_service"             # the caller that prices with a tier
    max_tokens: 900

  # Multi-language: the same concept, a different sample.
  - id: q9
    repo: bookstore-go
    baseline_root: go
    question: "How does the Go implementation apply tier multipliers?"
    baseline_grep: "TierMultipliers"
    expect_symbols:
      - pricing.ApplyBulkDiscount
    min_recall: 1.0

  - id: q10
    tool: file_context
    target: services/pricing.py
    repo: bookstore-python
    baseline_root: python
    baseline_grep: "PricingService"
    question: "What is in the pricing module?"
    must_contain:
      - "apply_bulk_discount"
      - "base_price"
      - "apply_coupon"
    max_tokens: 500

  # --- Language coverage -------------------------------------------------
  #
  # q1-q10 are almost entirely Python, which hid a real defect: the
  # leftover-module chunker only understood Python's import and comment
  # syntax, so Go, Rust, Java and TypeScript files were indexing their
  # licence headers and import lists as content. Eval passed 10/10
  # throughout, in both directions, because it never asked those languages
  # anything. These cases exist so that a chunking change has to survive
  # every language it touches, not just the one the harness grew up on.

  - id: q11
    repo: bookstore-rust
    baseline_root: rust
    question: "How is the bulk discount calculated in the Rust implementation?"
    baseline_grep: "discount"
    expect_symbols:
      - src.pricing.apply_bulk_discount
    min_recall: 1.0

  - id: q12
    repo: bookstore-java
    baseline_root: java
    question: "How is the bulk discount calculated in the Java implementation?"
    baseline_grep: "discount"
    expect_symbols:
      - PricingService.applyBulkDiscount
    min_recall: 1.0

  - id: q13
    repo: bookstore-typescript
    baseline_root: typescript
    question: "How is the bulk discount calculated in the TypeScript implementation?"
    baseline_grep: "discount"
    expect_symbols:
      - applyBulkDiscount
    min_recall: 1.0

  - id: q14
    repo: bookstore-go
    baseline_root: go
    question: "Where are orders saved to storage?"
    baseline_grep: "Save"
    expect_symbols:
      - order_repo.Save
    min_recall: 1.0

  # Types are not callables, so they are never their own chunk: a Rust enum
  # or a TypeScript interface lives in the leftover module chunk for its
  # file, along with the doc comment above it. An over-eager boilerplate
  # filter deletes exactly that. These two ask for a type's shape and so
  # fail if module chunks, or the doc comments in them, stop being indexed.
  - id: q15
    repo: bookstore-rust
    baseline_root: rust
    question: "What fields does a sellable book have?"
    baseline_grep: "struct Book"
    expect_files:
      - src/models.rs
    min_recall: 1.0

  - id: q16
    repo: bookstore-typescript
    baseline_root: typescript
    question: "What fields does a book have?"
    baseline_grep: "interface Book"
    expect_files:
      - src/models.ts
    min_recall: 1.0
