  - message: "Add the gold tier to the browser bundle"
    files: ["typescript/src/pricing.ts", "typescript/config/rates.yaml"]
  - message: "Correct the browser gold multiplier"
    files: ["typescript/config/rates.yaml", "typescript/src/pricing.ts"]
  - message: "Cover browser pricing"
